<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modify Password - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 600px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="Modify Login Password">Change Admin Password</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Update portal administrator password</p>
    </div>

    <!-- Password Form Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v2h2v-2h2v-2h-8.35zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
          <span lang="Modify Login Password">Password Security Update</span>
        </div>
      </div>

      <div class="m3-form-group">
        <label class="m3-label" for="oldpwd" lang="Old Password">Current Admin Password</label>
        <div class="m3-input-wrapper">
          <input type="password" id="oldpwd" name="wifi.passPhrase" class="m3-input" maxlength="64" placeholder="Enter current password" autocomplete="current-password">
          <button type="button" id="m3-oldpwd-toggle" class="m3-input-icon-btn" title="Toggle password visibility">
            <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <div class="m3-form-group">
        <label class="m3-label" for="newpwd" lang="New Password">New Admin Password</label>
        <div class="m3-input-wrapper">
          <input type="password" id="newpwd" name="wifi.passPhrase" class="m3-input" maxlength="64" placeholder="Enter new password (12-64 chars)" autocomplete="new-password">
          <button type="button" id="m3-newpwd-toggle" class="m3-input-icon-btn" title="Toggle password visibility">
            <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
        <span class="m3-helper-text" style="margin-top: 6px;" lang="New password: 12 to 64 characters; letters, digits and _ - . ! @ # % ^ * + = ? ~; different from the old password">
          Policy: 12 to 64 characters; letters, digits and _ - . ! @ # % ^ * + = ? ~; must differ from old password.
        </span>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
        <input type="submit" id="apply" class="m3-btn m3-btn-primary" value="Update Password" lang="Save">
      </div>
    </div>
  </div>

  <script src="./js/modifyPwd.js" type="text/javascript"></script>
  <script>
    $(function() {
      $('#m3-oldpwd-toggle').on('click', function() {
        var input = $('#oldpwd');
        var type = input.attr('type') === 'password' ? 'text' : 'password';
        input.attr('type', type);
      });
      $('#m3-newpwd-toggle').on('click', function() {
        var input = $('#newpwd');
        var type = input.attr('type') === 'password' ? 'text' : 'password';
        input.attr('type', type);
      });
    });
  </script>
</body>
</html>
