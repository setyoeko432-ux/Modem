<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHCP Server & Devices - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 1000px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="DHCP Setting">DHCP Server &amp; Connected Devices</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Configure local LAN IP range, DNS servers, and view active lease clients</p>
    </div>

    <!-- DHCP Server Settings Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          <span lang="DHCP Setting">DHCP Server Configuration</span>
        </div>
      </div>

      <div class="m3-grid">
        <div class="m3-form-group">
          <label class="m3-label" lang="DHCP-IP">Router LAN IP Address</label>
          <div class="m3-input" id="ip" style="display: flex; align-items: center; background-color: var(--md-sys-color-surface-container-low); font-weight: 600;">192.168.100.1</div>
        </div>

        <div class="m3-form-group">
          <label class="m3-label" for="dns1">Primary DNS</label>
          <input id="dns1" type="text" name="router.DHCP.DNS1" class="m3-input" value="192.168.100.1">
        </div>

        <div class="m3-form-group">
          <label class="m3-label" for="dns2">Secondary DNS</label>
          <input id="dns2" type="text" name="router.DHCP.DNS2" class="m3-input" value="192.168.100.1">
        </div>

        <div class="m3-form-group">
          <label class="m3-label" for="range_low">DHCP Range Start IP</label>
          <input id="range_low" type="text" name="router.DHCP.range.low" class="m3-input" disabled value="192.168.100.2">
        </div>

        <div class="m3-form-group">
          <label class="m3-label" for="range_high">DHCP Range End IP</label>
          <input id="range_high" type="text" name="router.DHCP.range.high" class="m3-input" disabled value="192.168.100.254">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
        <input type="submit" class="m3-btn m3-btn-primary" id="apply" value="Save DHCP Settings" lang="Change DHCP Setting">
      </div>
    </div>

    <!-- Active Connected Clients Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M4 6h16v10H4z" fill="none"/><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
          <span lang="Current Devices">Active Connected Devices</span>
        </div>
      </div>

      <div id="list" class="m3-table-container">
        <table id="table" class="m3-table clients table_list">
          <thead>
            <tr>
              <th>#</th>
              <th lang="Name">Device Name</th>
              <th lang="Assigned IP">Assigned IP</th>
              <th lang="MAC">MAC Address</th>
              <th lang="Media">Connection Media</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./js/D_HCP.js" type="text/javascript"></script>
</body>
</html>
