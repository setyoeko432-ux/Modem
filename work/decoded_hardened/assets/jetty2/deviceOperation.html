<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Operation - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 800px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="Device Operation">Device Operations</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">System restart and factory reset operations</p>
    </div>

    <!-- Operations Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8C6.25 13.93 6 12.99 6 12c0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.87.7 1.81.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
          <span lang="Device Operation">System Actions</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 20px;">
        <!-- Reboot Row -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--md-sys-color-outline-variant);">
          <div>
            <div class="m3-title-medium" style="font-weight: 600;" lang="Device Restart">Restart Device</div>
            <div class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Reboot the modem hardware and wireless interfaces</div>
          </div>
          <input type="submit" id="restart" class="m3-btn m3-btn-tonal" value="Restart" lang="Restart">
        </div>

        <!-- Factory Reset Row -->
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div class="m3-title-medium" style="font-weight: 600; color: var(--md-sys-color-error);" lang="FactoryReset">Factory Reset</div>
            <div class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Reset all configurations to factory default settings</div>
          </div>
          <input type="submit" id="factory" class="m3-btn m3-btn-danger" value="Factory Reset" lang="Factory Reset">
        </div>
      </div>

      <!-- Loading Banner -->
      <div id="content2" style="display: none; margin-top: 20px; padding: 16px; border-radius: var(--md-sys-shape-corner-m); background-color: var(--md-sys-color-warning-container); color: var(--md-sys-color-on-warning-container);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="m3-status-dot m3-status-dot-pulse"></span>
          <span class="m3-title-medium" lang="Restarting,please wait">Restarting modem, please wait...</span>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/deviceOperation.js" type="text/javascript"></script>
</body>
</html>
