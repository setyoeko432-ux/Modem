<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Information - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
  <style>
    .m3-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .m3-info-row:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <div style="max-width: 800px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="Device Information">Hardware &amp; Device Information</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">View modem model, chipset, signal dBm, and IMEI configuration</p>
    </div>

    <!-- Device Info Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v2h-2V4z"/></svg>
          <span lang="Device Information">Modem Specification</span>
        </div>
      </div>

      <div>
        <div class="m3-info-row">
          <span class="m3-label" lang="Manufacturer">Manufacturer</span>
          <span class="m3-body-medium" id="manufacturer" style="font-weight: 600;">Qualcomm Technology</span>
        </div>
        <div class="m3-info-row">
          <span class="m3-label" lang="Model">Model &amp; Firmware</span>
          <span class="m3-body-medium" id="FWversion" style="font-weight: 600;">4G MIFI</span>
        </div>
        <div class="m3-info-row">
          <span class="m3-label" lang="dbm:">Signal Strength (dBm)</span>
          <span class="m3-body-medium" id="dbmSignal" style="font-weight: 600; font-family: monospace;">- dBm</span>
        </div>
      </div>

      <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--md-sys-color-outline-variant);">
        <div class="m3-form-group">
          <label class="m3-label" for="imei">IMEI Identity Number</label>
          <div style="display: flex; gap: 12px; align-items: center;">
            <input id="imei" name="imei" type="text" class="m3-input" maxlength="15" style="flex: 1; font-family: monospace;" placeholder="86XXXXXXXXXXXXXXXX">
            <input type="submit" id="apply" class="m3-btn m3-btn-primary" value="Save IMEI" lang="Save">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/deviceInformation.js" type="text/javascript"></script>
</body>
</html>
