<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM Information - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
  <style>
    .m3-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }
    .m3-info-row:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <div style="max-width: 800px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="SIM Information">SIM Card Status &amp; Info</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">View SIM status, IMSI, and ICCID identity numbers</p>
    </div>

    <!-- SIM Info Card -->
    <div id="block1" class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M19.99 4c0-1.1-.89-2-1.99-2h-8L4 8v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2l.01-16zM9 19H7v-2h2v2zm0-4H7v-4h2v4zm4 4h-2v-4h2v4zm0-6h-2v-2h2v2zm4 6h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
          <span lang="SIM Information">SIM Status Details</span>
        </div>
      </div>

      <div>
        <div class="m3-info-row">
          <span class="m3-label" id="sim.status" lang="Status">SIM Card Status</span>
          <span class="m3-chip m3-chip-success" id="simsta" lang="Ready">Ready</span>
        </div>
        <div class="m3-info-row" id="imsi">
          <span class="m3-label" id="sim.imsi">IMSI Identity Number</span>
          <span class="m3-body-medium" id="sim_imsi" style="font-weight: 600; font-family: monospace;">-</span>
        </div>
        <div class="m3-info-row" id="iccid">
          <span class="m3-label" id="sim.iccid">ICCID Serial Number</span>
          <span class="m3-body-medium" id="sim_iccid" style="font-weight: 600; font-family: monospace;">-</span>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/sim.js" type="text/javascript"></script>
</body>
</html>
