<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Select - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 800px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="Network Selection">Network Mode Selection</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Select cellular RAT network preference (Auto, 3G Only, or 4G Only)</p>
    </div>

    <!-- Network Select Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
          <span lang="Networks:">Preferred Network Mode</span>
        </div>
      </div>

      <div class="m3-form-group" style="margin-top: 12px;">
        <label class="m3-label" for="select" id="RAT">Cellular Network RAT Mode</label>
        <select id="select" name="wwan.RAT" class="m3-select">
          <option value="0" lang="Auto">Auto (4G / 3G / 2G)</option>
          <option value="1" lang="3G Only">3G Only (WCDMA / UMTS)</option>
          <option value="2" lang="4G Only">4G Only (LTE)</option>
        </select>
        <span class="m3-helper-text" style="margin-top: 6px;">Note: Changing network modes may temporarily interrupt data connectivity.</span>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
        <input type="submit" id="apply" class="m3-btn m3-btn-primary" value="Apply Selection" lang="Apply">
      </div>
    </div>
  </div>

  <script src="./js/netsel.js" type="text/javascript"></script>
</body>
</html>
