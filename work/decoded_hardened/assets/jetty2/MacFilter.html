<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC Address Filter - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 1000px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="MAC Address Filter">Wi-Fi MAC Address Filter</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Control device wireless access with blacklist or whitelist filtering</p>
    </div>

    <!-- Active Connected Devices Section -->
    <div id="main2" class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M4 6h16v10H4z" fill="none"/><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
          <span lang="Current Devices">Connected Wireless Devices</span>
        </div>
      </div>

      <div id="list2" class="m3-table-container" style="display: none;">
        <table id="table2" class="m3-table clients table_list">
          <thead>
            <tr>
              <th>#</th>
              <th lang="Name">Device Name</th>
              <th lang="Assigned IP">Assigned IP</th>
              <th lang="MAC">MAC Address</th>
              <th lang="Media">Media</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="noData" class="m3-body-medium" style="padding: 16px; text-align: center; color: var(--md-sys-color-on-surface-variant);" lang="No data">No active wireless devices detected.</div>
      </div>
    </div>

    <!-- MAC Filter Rules Card -->
    <div id="main" class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <span lang="MAC Address Filter">MAC Filter Rule Policy</span>
        </div>
      </div>

      <div class="m3-form-group" style="max-width: 360px;">
        <label class="m3-label" for="selectMactype" id="RAT" lang="MAC List">Filter Access Policy</label>
        <select id="selectMactype" name="wifi.mac" class="m3-select">
          <option value="0" lang="black list">Blacklist (Deny listed MACs)</option>
          <option value="1" lang="white list">Whitelist (Allow only listed MACs)</option>
          <option value="3" lang="close" selected>Disabled (Allow all)</option>
        </select>
      </div>

      <div id="list" class="m3-table-container" style="margin-top: 16px;">
        <table id="table" class="m3-table clients table_list">
          <thead>
            <tr>
              <th lang="id">ID</th>
              <th lang="MAC">MAC Address Entry</th>
              <th lang="Save">Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./js/MacFilter.js" type="text/javascript"></script>
</body>
</html>
