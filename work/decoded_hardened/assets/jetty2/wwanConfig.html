<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APN Setting - 4G Modem</title>
  <link rel="stylesheet" href="css/m3-theme.css">
  <link rel="stylesheet" href="css/layer.css">
  <script src="./js/m3-theme.js"></script>
  <script src="./js/plugins/jquery.js" type="text/javascript"></script>
  <script src="./js/utils/ajax.js" type="text/javascript"></script>
  <script src="./js/plugins/json2.js" type="text/javascript"></script>
  <script src="./js/plugins/layer.js" type="text/javascript"></script>
  <script src="./js/utils/alert.js" type="text/javascript"></script>
  <script src="./js/plugins/jquerysession.js" type="text/javascript"></script>
  <script src="./js/utils/cookiesHandler.js" type="text/javascript"></script>
  <script src="./js/utils/jsonHandler.js" type="text/javascript"></script>
</head>

<body>
  <div style="max-width: 1000px; margin: 0 auto;">
    <!-- Page Header -->
    <div style="margin-bottom: 24px;">
      <h1 class="m3-headline-small" style="font-weight: 600; color: var(--md-sys-color-on-surface);" lang="APN Configuration">APN &amp; Cellular Profiles</h1>
      <p class="m3-body-medium" style="color: var(--md-sys-color-on-surface-variant);">Configure carrier Access Point Names and authentication profiles</p>
    </div>

    <!-- Active Profile Selection Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          <span lang="APN Connection">Active APN Profile Selection</span>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
        <label class="m3-chip" style="cursor: pointer;">
          <input id="mifi_apn_is_auto" type="radio" name="wwan.connect" value="0">
          <span lang="Default APN:">Default Auto APN</span>
        </label>
        <label class="m3-chip" style="cursor: pointer;">
          <input id="p1" type="radio" name="wwan.connect" value="1">
          <span>Profile 1</span>
        </label>
        <label class="m3-chip" style="cursor: pointer;">
          <input id="p2" type="radio" name="wwan.connect" value="2">
          <span>Profile 2</span>
        </label>
        <label class="m3-chip" style="cursor: pointer;">
          <input id="p3" type="radio" name="wwan.connect" value="3">
          <span>Profile 3</span>
        </label>
        <label class="m3-chip" style="cursor: pointer;">
          <input id="p4" type="radio" name="wwan.connect" value="4">
          <span>Profile 4</span>
        </label>
        <label class="m3-chip" style="cursor: pointer;">
          <input id="p5" type="radio" name="wwan.connect" value="5">
          <span>Profile 5</span>
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <input type="submit" id="mifi_apn_connect1" class="m3-btn m3-btn-primary" value="Set Active APN" lang="Execute">
      </div>
    </div>

    <!-- APN Configuration Card -->
    <div class="m3-card">
      <div class="m3-card-header">
        <div class="m3-card-title">
          <svg class="m3-icon" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
          <span lang="APN Configuration">APN Profiles Edit</span>
        </div>
      </div>

      <!-- Profiles 1 to 5 -->
      <div id="content">
        <!-- Profile 1 -->
        <div id="profile1" class="profile" style="display:none; margin-bottom: 20px;">
          <h3 class="m3-title-medium" style="margin-bottom: 12px;">Profile 1</h3>
          <div class="m3-grid">
            <div class="m3-form-group"><label class="m3-label" lang="Name: ">Profile Name</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="APN:">APN String</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="User:">Username</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Password:">Password</label><input type="password" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Auth:">Auth Type</label><select class="m3-select select"><option value="0" lang="None">None</option><option value="1">PAP</option><option value="2">CHAP</option><option value="3">CHAP/PAP</option></select></div>
          </div>
        </div>

        <!-- Profile 2 -->
        <div id="profile2" class="profile" style="display:none; margin-bottom: 20px;">
          <h3 class="m3-title-medium" style="margin-bottom: 12px;">Profile 2</h3>
          <div class="m3-grid">
            <div class="m3-form-group"><label class="m3-label" lang="Name:">Profile Name</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="APN:">APN String</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="User:">Username</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Password:">Password</label><input type="password" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Auth:">Auth Type</label><select class="m3-select select"><option value="0" lang="None">None</option><option value="1">PAP</option><option value="2">CHAP</option><option value="3">CHAP/PAP</option></select></div>
          </div>
        </div>

        <!-- Profile 3 -->
        <div id="profile3" class="profile" style="display:none; margin-bottom: 20px;">
          <h3 class="m3-title-medium" style="margin-bottom: 12px;">Profile 3</h3>
          <div class="m3-grid">
            <div class="m3-form-group"><label class="m3-label" lang="Name:">Profile Name</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="APN:">APN String</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="User:">Username</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Password:">Password</label><input type="password" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Auth:">Auth Type</label><select class="m3-select select"><option value="0" lang="None">None</option><option value="1">PAP</option><option value="2">CHAP</option><option value="3">CHAP/PAP</option></select></div>
          </div>
        </div>

        <!-- Profile 4 -->
        <div id="profile4" class="profile" style="display:none; margin-bottom: 20px;">
          <h3 class="m3-title-medium" style="margin-bottom: 12px;">Profile 4</h3>
          <div class="m3-grid">
            <div class="m3-form-group"><label class="m3-label" lang="Name:">Profile Name</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="APN:">APN String</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="User:">Username</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Password:">Password</label><input type="password" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Auth:">Auth Type</label><select class="m3-select select"><option value="0" lang="None">None</option><option value="1">PAP</option><option value="2">CHAP</option><option value="3">CHAP/PAP</option></select></div>
          </div>
        </div>

        <!-- Profile 5 -->
        <div id="profile5" class="profile" style="display:none; margin-bottom: 20px;">
          <h3 class="m3-title-medium" style="margin-bottom: 12px;">Profile 5</h3>
          <div class="m3-grid">
            <div class="m3-form-group"><label class="m3-label" lang="Name:">Profile Name</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="APN:">APN String</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="User:">Username</label><input type="text" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Password:">Password</label><input type="password" class="m3-input"></div>
            <div class="m3-form-group"><label class="m3-label" lang="Auth:">Auth Type</label><select class="m3-select select"><option value="0" lang="None">None</option><option value="1">PAP</option><option value="2">CHAP</option><option value="3">CHAP/PAP</option></select></div>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
        <input id="save" type="submit" class="m3-btn m3-btn-primary" value="Save Configuration" lang="Save Configuration">
      </div>
    </div>
  </div>

  <script src="./js/wwanConfig.js" type="text/javascript"></script>
</body>
</html>
